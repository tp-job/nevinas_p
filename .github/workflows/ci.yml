# The gate that makes the compiler and lint work permanent.
#
# Both were true once before and decayed: tsconfig.app.json shipped with
# "strict": false, and the client's lint count reached 74 errors without anyone
# noticing, because nothing ran on push. Every individual change looked fine.
#
# Zero-tolerance is the point. There is no `continue-on-error` here and no
# `--max-warnings` allowance — the client is at 0 errors AND 0 warnings, so any
# number above zero is a regression introduced by the commit under test.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # `npm run build` is `vite build`, which does NOT typecheck — esbuild
      # strips types without checking them. tsc has to run as its own step or
      # a green build proves nothing about types.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint (zero tolerance)
        run: npm run lint -- --max-warnings 0

      # Pure-logic tests only, by design. The homepage is an animation-heavy
      # scroll experience where component tests are expensive and brittle; the
      # functions covered here (contrast ratios, repo filtering, calendar date
      # bucketing, chart token resolution) are where a regression is SILENT.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  server:
    name: server — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (zero tolerance)
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build
