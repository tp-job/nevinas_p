<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- icon — served as a file rather than an inline data: URI. The previous
         inline SVG put ~700 bytes of unescaped "<svg …>" markup inside an href
         at the very top of <head>, which tripped Lighthouse's charset audit. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#608dee" />

    <!-- ── Primary SEO metadata ─────────────────────────────────────────────
         Lighthouse's SEO audit reads the <title> and <meta description>; the
         previous bare "Nevinas-ka" title carried no keywords and there was no
         description element at all. -->
    <title>Nevinas Ka — Frontend Web Developer | React &amp; TypeScript Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Nevinas Ka, a frontend web developer crafting responsive, high-performance, pixel-perfect web interfaces with React, TypeScript and Tailwind CSS."
    />
    <link rel="canonical" href="https://nevinas-p.onrender.com/" />

    <!-- ── Open Graph / Twitter (link previews; indirect SEO) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nevinas-p.onrender.com/" />
    <meta property="og:title" content="Nevinas Ka — Frontend Web Developer" />
    <meta
      property="og:description"
      content="Crafting responsive, high-performance, pixel-perfect web interfaces using modern frontend standards."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nevinas Ka — Frontend Web Developer" />
    <meta
      name="twitter:description"
      content="Crafting responsive, high-performance, pixel-perfect web interfaces using modern frontend standards."
    />

    <!-- ── Structured data ──────────────────────────────────────────────────
         Machine-readable identity for search engines AND for the Agentic
         Browsing category, which rewards content an agent can parse without
         first executing the SPA. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nevinas Ka",
        "url": "https://nevinas-p.onrender.com/",
        "jobTitle": "Frontend Web Developer",
        "knowsAbout": ["React", "TypeScript", "Tailwind CSS", "Web Performance", "UI Engineering"]
      }
    </script>

    <!-- ── Fonts ────────────────────────────────────────────────────────────
         Inter and Zen Kaku Gothic New (Latin) are SELF-HOSTED via @fontsource
         and bundled by Vite through src/index.css. Playpen Sans is loaded from
         Google Fonts below. Remix Icon is also self-hosted (subset). This setup
         removed render-blocking third-party stylesheets and extra origin
         handshakes from the critical path.

         The only remaining webfont request covers the ~151 Japanese glyphs the
         site actually renders. `text=` makes Google return a micro-subset of a
         few KB instead of the full multi-megabyte CJK family, and the
         preload/onload swap keeps it off the render-blocking path — Japanese
         accents swap in a beat later rather than delaying first paint. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+JP:wght@300;400&display=swap&text=%E3%82%A2%E3%82%A3%E3%82%A4%E3%81%84%E3%82%A6%E3%83%B4%E3%82%A7%E3%82%A8%E3%81%88%E3%82%A9%E3%82%AA%E3%81%8A%E3%82%AB%E3%81%8C%E3%82%AD%E3%82%AF%E3%81%8F%E3%82%B0%E3%82%B1%E3%82%B3%E3%82%B4%E3%82%B5%E3%81%95%E3%82%B6%E3%82%B7%E3%81%97%E3%82%B8%E3%81%98%E3%82%B9%E3%81%99%E3%82%BB%E3%81%9B%E3%81%9D%E3%82%BF%E3%81%A0%E3%81%9F%E3%83%83%E3%83%84%E3%81%A4%E3%83%86%E3%81%A6%E3%83%87%E3%81%A7%E3%83%88%E3%81%A8%E3%83%89%E3%83%8A%E3%81%AA%E3%81%AB%E3%83%8D%E3%83%8E%E3%81%AE%E3%81%AF%E3%83%90%E3%83%91%E3%83%93%E3%81%B3%E3%83%95%E3%83%96%E3%83%9D%E3%83%9E%E3%81%BE%E3%81%BF%E3%83%A0%E3%83%A1%E3%83%A3%E3%83%A5%E3%83%A7%E3%83%A9%E3%83%AA%E3%83%AB%E3%82%8B%E3%83%AC%E3%83%AD%E3%82%8F%E3%82%92%E3%83%B3%E4%B8%96%E4%B8%AD%E4%BA%86%E4%BD%9C%E5%83%8F%E5%85%A5%E5%86%99%E5%87%BA%E5%88%86%E5%88%9D%E5%89%8D%E5%8B%95%E5%8C%96%E5%90%88%E5%90%8D%E5%93%81%E5%95%8F%E5%9C%A8%E5%A4%9C%E5%A4%A2%E5%AE%8C%E5%AE%9F%E5%B7%A7%E5%BD%A1%E5%BF%9C%E6%81%B5%E6%84%9F%E6%88%91%E6%8A%80%E6%8A%BC%E6%95%B4%E6%96%B0%E6%97%85%E6%9C%80%E6%9C%9F%E6%9E%90%E6%A5%BD%E6%A6%82%E6%AC%A1%E6%AD%A9%E6%B2%A1%E7%8F%BE%E7%94%BB%E7%95%8C%E7%95%B0%E7%99%BA%E7%9C%9F%E7%9F%A5%E7%A7%81%E7%AD%94%E7%B2%BE%E7%B5%82%E7%B5%A1%E8%80%83%E8%80%85%E8%81%B4%E8%A1%8C%E8%A1%93%E8%A6%81%E8%A6%B3%E8%A8%98%E8%AA%AD%E8%AA%BF%E8%B5%B7%E8%BA%AB%E8%BE%BC%E9%80%A3%E9%81%8A%E9%81%93%E9%8C%B2%E9%96%89%E9%96%8B%E9%96%93%E3%83%BC"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+JP:wght@300;400&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
